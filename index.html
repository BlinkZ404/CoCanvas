<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      (function () {
        try {
          var pref = localStorage.getItem("cocanvas.theme") || "system";
          var dark =
            pref === "dark" ||
            (pref !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var theme = dark ? "dark" : "light";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
    <style>
      html,
      body {
        background: #12141a;
        color: #e6e8ee;
      }
      html[data-theme="light"],
      html[data-theme="light"] body {
        background: #eceef1;
        color: #17181c;
      }
    </style>
    <title>CoCanvas: your brief, your board, your agent</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16.png" type="image/png" sizes="16x16" />
    <link rel="icon" href="/icon-512.png" type="image/png" sizes="512x512" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <meta name="theme-color" content="#12141a" />
    <meta
      name="description"
      content="Write a brief. Share the board with an agent. Undo the bad draft. No upload, no account, no screenshot guessing."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="CoCanvas: your brief, your board, your agent" />
    <meta
      property="og:description"
      content="Write a brief. Share the board with an agent. Undo the bad draft. No upload, no account, no screenshot guessing."
    />
    <meta property="og:url" content="https://cocanvas-beta.vercel.app" />
    <meta property="og:image" content="https://cocanvas-beta.vercel.app/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CoCanvas: your brief, your board, your agent" />
    <meta
      name="twitter:description"
      content="Write a brief. Share the board with an agent. Undo the bad draft. No upload, no account, no screenshot guessing."
    />
    <meta name="twitter:image" content="https://cocanvas-beta.vercel.app/og.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400..600&family=Geist+Mono:wght@400..600&display=swap"
      rel="stylesheet"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
